[build]
  command = "cd las-canas-react && npm ci && npm run build"
  publish = "las-canas-react/dist"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    # blob: lo necesita el visor de comprobantes del panel: el archivo se baja
    # con fetch autenticado y se muestra desde un object URL, no desde una URL
    # pública.
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' https://cdn.tailwindcss.com https://cdn.jsdelivr.net 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src 'self' blob: https:; frame-ancestors 'self';"
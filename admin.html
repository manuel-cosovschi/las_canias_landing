<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Las Cañas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900">

<header class="bg-white shadow">
  <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
    <a href="index.html" class="font-bold text-xl">← Las Cañas</a>
    <button id="btnAuth"
      class="px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold">
      Iniciar sesión
    </button>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-2">Panel de Dueños</h1>
  <p class="text-gray-600 mb-6">Confirmar transferencias y bloquear fechas.</p>

  <div id="status"
    class="mb-6 p-4 rounded-lg bg-gray-100 text-sm text-gray-700">
    Iniciá sesión para continuar.
  </div>

  <section id="app" class="hidden">

    <!-- Tabs -->
    <div class="flex gap-2 mb-6">
      <button id="tabBlock"
        class="px-4 py-2 rounded-lg bg-gray-100 border font-semibold">
        Bloquear fechas
      </button>
      <button id="tabTransfers"
        class="px-4 py-2 rounded-lg bg-white border font-semibold">
        Transferencias
      </button>
    </div>

    <!-- BLOQUEAR FECHAS -->
    <div id="viewBlock" class="bg-white rounded-xl shadow p-6">
      <h2 class="text-xl font-semibold mb-4">Bloqueo manual</h2>

      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Casa</label>
          <select id="house" class="w-full border rounded-lg p-3">
            <option value="LC1">Las Cañas 1</option>
            <option value="LC2">Las Cañas 2</option>
            <option value="LC3">Las Cañas 3</option>
            <option value="LC4">Las Cañas 4</option>
            <option value="LC5">Las Cañas 5</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Motivo</label>
          <input id="note"
            class="w-full border rounded-lg p-3"
            placeholder="Ej: mantenimiento" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Check-in</label>
          <input id="checkin" type="date"
            class="w-full border rounded-lg p-3" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Check-out</label>
          <input id="checkout" type="date"
            class="w-full border rounded-lg p-3" />
        </div>
      </div>

      <button id="btnBlock"
        class="mt-5 w-full py-3 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-700">
        Bloquear fechas
      </button>
    </div>

    <!-- TRANSFERENCIAS -->
    <div id="viewTransfers"
      class="bg-white rounded-xl shadow p-6 hidden">
      <h2 class="text-xl font-semibold mb-4">Transferencias pendientes</h2>

      <button id="btnRefresh"
        class="mb-4 px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold">
        Actualizar lista
      </button>

      <div id="pendingList" class="space-y-3 text-sm"></div>
    </div>

  </section>
</main>

<script>
/* =====================
   AUTH SIMPLE (PASSWORD)
===================== */
const OWNER_KEY = "lc_owner_secret";

function getSecret() {
  return localStorage.getItem(OWNER_KEY);
}

function login() {
  const secret = prompt("Clave de acceso para dueños:");
  if (!secret) return;
  localStorage.setItem(OWNER_KEY, secret);
  location.reload();
}

function logout() {
  localStorage.removeItem(OWNER_KEY);
  location.reload();
}

/* =====================
   HELPERS
===================== */
const el = (id) => document.getElementById(id);
const statusBox = el("status");
const app = el("app");
const btnAuth = el("btnAuth");

function setStatus(msg) {
  statusBox.textContent = msg;
}

/* =====================
   API FETCH
===================== */
async function apiFetch(url, { method = "POST", body = null } = {}) {
  const secret = getSecret();
  if (!secret) throw new Error("No autorizado");

  const res = await fetch(url, {
    method,
    headers: {
      "Content-Type": "application/json",
      "x-lc-secret": secret,
    },
    body: body ? JSON.stringify(body) : null,
  });

  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || "Error");
  return data;
}

/* =====================
   INIT AUTH UI
===================== */
if (getSecret()) {
  btnAuth.textContent = "Cerrar sesión";
  app.classList.remove("hidden");
  setStatus("Panel habilitado");
} else {
  btnAuth.textContent = "Iniciar sesión";
  app.classList.add("hidden");
  setStatus("Iniciá sesión para continuar.");
}

btnAuth.addEventListener("click", () => {
  getSecret() ? logout() : login();
});

/* =====================
   TABS
===================== */
const tabBlock = el("tabBlock");
const tabTransfers = el("tabTransfers");
const viewBlock = el("viewBlock");
const viewTransfers = el("viewTransfers");

function showTab(tab) {
  const isBlock = tab === "block";
  viewBlock.classList.toggle("hidden", !isBlock);
  viewTransfers.classList.toggle("hidden", isBlock);
  tabBlock.classList.toggle("bg-gray-100", isBlock);
  tabTransfers.classList.toggle("bg-gray-100", !isBlock);
}

tabBlock.onclick = () => showTab("block");
tabTransfers.onclick = () => showTab("transfers");
showTab("block");

/* =====================
   BLOQUEAR FECHAS
===================== */
el("btnBlock").onclick = async () => {
  try {
    const payload = {
      house_code: el("house").value,
      checkin: el("checkin").value,
      checkout: el("checkout").value,
      note: el("note").value || "",
    };

    if (!payload.checkin || !payload.checkout) {
      setStatus("Elegí check-in y check-out");
      return;
    }

    setStatus("Bloqueando...");
    const out = await apiFetch("/.netlify/functions/owner-blocks", {
      body: payload
    });
    setStatus(`✅ Bloqueado (${out.id})`);
  } catch (e) {
    setStatus(`❌ ${e.message}`);
  }
};

/* =====================
   TRANSFERENCIAS
===================== */
async function loadPending() {
  const out = await apiFetch("/.netlify/functions/list-pending", {
    method: "GET"
  });

  const box = el("pendingList");
  box.innerHTML = "";

  if (!out.items || !out.items.length) {
    box.innerHTML = `<div class="p-4 bg-gray-50 rounded">No hay pendientes.</div>`;
    return;
  }

  out.items.forEach(r => {
    const div = document.createElement("div");
    div.className = "p-4 border rounded bg-white";
    div.innerHTML = `
      <div class="font-semibold">${r.id} — ${r.house_code}</div>
      <div>${r.check_in} → ${r.check_out}</div>
      <div>${r.guest_name} — ${r.phone}</div>
      <div class="text-xs text-gray-500">Vence: ${r.expires_at || "-"}</div>
      <div class="mt-3 flex gap-2">
        <button class="confirm px-3 py-2 bg-green-600 text-white rounded"
          data-id="${r.id}">Confirmar</button>
        <button class="cancel px-3 py-2 bg-gray-200 rounded"
          data-id="${r.id}">Cancelar</button>
      </div>
    `;
    box.appendChild(div);
  });

  box.querySelectorAll(".confirm").forEach(b =>
    b.onclick = async () => {
      await apiFetch("/.netlify/functions/confirm-transfer", {
        body: { id: b.dataset.id }
      });
      loadPending();
    }
  );

  box.querySelectorAll(".cancel").forEach(b =>
    b.onclick = async () => {
      await apiFetch("/.netlify/functions/cancel-reservation", {
        body: { id: b.dataset.id }
      });
      loadPending();
    }
  );
}

el("btnRefresh").onclick = async () => {
  try {
    setStatus("Cargando...");
    await loadPending();
    setStatus("Lista actualizada");
  } catch (e) {
    setStatus(`❌ ${e.message}`);
  }
};
</script>

</body>
</html>

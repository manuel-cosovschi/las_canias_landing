<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Las Cañas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900">

<header class="bg-white shadow">
  <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
    <a href="index.html" class="font-bold text-xl">← Las Cañas</a>
    <button id="btnLogout" class="hidden px-4 py-2 rounded-lg bg-gray-900 text-white font-semibold">
      Cerrar sesión
    </button>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-10">

  <!-- LOGIN -->
  <section id="loginView" class="max-w-md mx-auto">
    <div class="bg-white rounded-2xl shadow p-6 border">
      <h1 class="text-2xl font-bold">Panel de Dueños</h1>
      <p class="text-gray-600 mt-1">Ingresá con tu usuario y contraseña.</p>

      <div class="mt-6 space-y-3">
        <div>
          <label class="block text-sm font-medium mb-1">Usuario</label>
          <input id="username" class="w-full border rounded-lg p-3" placeholder="admin" autocomplete="username" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Contraseña</label>
          <input id="password" type="password" class="w-full border rounded-lg p-3" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <p id="loginErr" class="hidden text-sm text-red-600"></p>

        <button id="btnLogin" class="w-full py-3 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700">
          Iniciar sesión
        </button>

        <p class="text-xs text-gray-500 mt-2">
          (Login simple, sin Netlify Identity)
        </p>
      </div>
    </div>
  </section>

  <!-- APP -->
  <section id="appView" class="hidden">
    <div id="status" class="mb-6 p-4 rounded-lg bg-gray-100 text-sm text-gray-700">
      Panel habilitado.
    </div>

    <!-- Tabs -->
    <div class="flex gap-2 mb-6">
      <button id="tabBlock" class="px-4 py-2 rounded-lg bg-gray-100 border font-semibold">Bloquear fechas</button>
      <button id="tabTransfers" class="px-4 py-2 rounded-lg bg-white border font-semibold">Transferencias</button>
    </div>

    <!-- BLOQUEAR -->
    <div id="viewBlock" class="bg-white rounded-xl shadow p-6">
      <h2 class="text-xl font-semibold mb-4">Bloqueo manual</h2>

      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Casa</label>
          <select id="house" class="w-full border rounded-lg p-3">
            <option value="LC1">Las Cañas 1</option>
            <option value="LC2">Las Cañas 2</option>
            <option value="LC3">Las Cañas 3</option>
            <option value="LC4">Las Cañas 4</option>
            <option value="LC5">Las Cañas 5</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Motivo</label>
          <input id="note" class="w-full border rounded-lg p-3" placeholder="Ej: mantenimiento" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Check-in</label>
          <input id="checkin" type="date" class="w-full border rounded-lg p-3" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Check-out</label>
          <input id="checkout" type="date" class="w-full border rounded-lg p-3" />
        </div>
      </div>

      <button id="btnBlock" class="mt-5 w-full py-3 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-700">
        Bloquear fechas
      </button>
    </div>

    <!-- TRANSFERENCIAS -->
    <div id="viewTransfers" class="bg-white rounded-xl shadow p-6 hidden">
      <div class="flex items-center justify-between gap-3 mb-4">
        <h2 class="text-xl font-semibold">Transferencias pendientes</h2>
        <button id="btnRefresh" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold">
          Actualizar lista
        </button>
      </div>

      <div id="pendingList" class="space-y-3 text-sm"></div>
    </div>

  </section>

</main>

<script>
  // Guardamos la LC_OWNER_SECRET que devuelve el server si login ok
  const STORAGE_KEY = "lc_owner_secret";
  const el = (id) => document.getElementById(id);

  const loginView = el("loginView");
  const appView = el("appView");
  const btnLogout = el("btnLogout");
  const loginErr = el("loginErr");
  const statusBox = el("status");

  function setStatus(msg) { statusBox.textContent = msg; }
  function showErr(msg) { loginErr.textContent = msg; loginErr.classList.remove("hidden"); }
  function clearErr() { loginErr.textContent = ""; loginErr.classList.add("hidden"); }

  function getSecret() { return localStorage.getItem(STORAGE_KEY); }
  function setSecret(s) { localStorage.setItem(STORAGE_KEY, s); }
  function clearSecret() { localStorage.removeItem(STORAGE_KEY); }

  function showApp() {
    loginView.classList.add("hidden");
    appView.classList.remove("hidden");
    btnLogout.classList.remove("hidden");
  }

  function showLogin() {
    loginView.classList.remove("hidden");
    appView.classList.add("hidden");
    btnLogout.classList.add("hidden");
  }

  async function apiFetch(url, { method="POST", body=null } = {}) {
    const secret = getSecret();
    if (!secret) throw new Error("No autorizado");

    const res = await fetch(url, {
      method,
      headers: {
        "Content-Type": "application/json",
        "x-lc-secret": secret,
      },
      body: body ? JSON.stringify(body) : null,
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || `Error (${res.status})`);
    return data;
  }

  async function validateSession() {
    // Probamos un endpoint real protegido. Si falla, cerramos sesión.
    try {
      await apiFetch("/.netlify/functions/list-pending", { method: "GET" });
      return true;
    } catch {
      clearSecret();
      return false;
    }
  }

  // LOGIN
  el("btnLogin").addEventListener("click", async () => {
    try {
      clearErr();
      const username = el("username").value.trim();
      const password = el("password").value;

      if (!username || !password) {
        showErr("Completá usuario y contraseña.");
        return;
      }

      const res = await fetch("/.netlify/functions/auth-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        showErr(data.message || "Login inválido");
        return;
      }

      setSecret(data.owner_secret);
      showApp();
      setStatus("✅ Panel habilitado.");
    } catch (e) {
      showErr(e.message || "Error");
    }
  });

  el("password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") el("btnLogin").click();
  });

  // LOGOUT
  btnLogout.addEventListener("click", () => {
    clearSecret();
    showLogin();
  });

  // TABS
  const tabBlock = el("tabBlock");
  const tabTransfers = el("tabTransfers");
  const viewBlock = el("viewBlock");
  const viewTransfers = el("viewTransfers");

  function showTab(tab) {
    const isBlock = tab === "block";
    viewBlock.classList.toggle("hidden", !isBlock);
    viewTransfers.classList.toggle("hidden", isBlock);
    tabBlock.classList.toggle("bg-gray-100", isBlock);
    tabTransfers.classList.toggle("bg-gray-100", !isBlock);
  }
  tabBlock.onclick = () => showTab("block");
  tabTransfers.onclick = () => showTab("transfers");
  showTab("block");

  // BLOQUEAR
  el("btnBlock").onclick = async () => {
    try {
      const payload = {
        house_code: el("house").value,
        checkin: el("checkin").value,
        checkout: el("checkout").value,
        note: el("note").value || "",
      };
      if (!payload.checkin || !payload.checkout) {
        setStatus("Elegí check-in y check-out");
        return;
      }
      setStatus("Bloqueando...");
      const out = await apiFetch("/.netlify/functions/owner-blocks", { body: payload });
      setStatus(`✅ Bloqueado (${out.id})`);
    } catch (e) {
      setStatus(`❌ ${e.message}`);
    }
  };

  // TRANSFERENCIAS
  async function loadPending() {
    const out = await apiFetch("/.netlify/functions/list-pending", { method: "GET" });
    const box = el("pendingList");
    box.innerHTML = "";

    if (!out.items || !out.items.length) {
      box.innerHTML = `<div class="p-4 bg-gray-50 rounded">No hay pendientes.</div>`;
      return;
    }

    out.items.forEach(r => {
      const div = document.createElement("div");
      div.className = "p-4 border rounded-xl bg-white";
      div.innerHTML = `
        <div class="font-semibold">${r.id} — ${r.house_code}</div>
        <div>${r.check_in} → ${r.check_out}</div>
        <div>${r.guest_name || "-"} — ${r.phone || "-"}</div>
        <div class="mt-3 flex gap-2">
          <button class="confirm px-3 py-2 bg-green-600 text-white rounded-lg font-semibold" data-id="${r.id}">Confirmar</button>
          <button class="cancel px-3 py-2 bg-gray-100 rounded-lg font-semibold" data-id="${r.id}">Cancelar</button>
        </div>
      `;
      box.appendChild(div);
    });

    box.querySelectorAll(".confirm").forEach(b => b.onclick = async () => {
      try {
        setStatus("Confirmando...");
        await apiFetch("/.netlify/functions/confirm-transfer", { body: { id: b.dataset.id } });
        setStatus(`✅ Confirmada: ${b.dataset.id}`);
        loadPending();
      } catch (e) { setStatus(`❌ ${e.message}`); }
    });

    box.querySelectorAll(".cancel").forEach(b => b.onclick = async () => {
      try {
        setStatus("Cancelando...");
        await apiFetch("/.netlify/functions/cancel-reservation", { body: { id: b.dataset.id } });
        setStatus(`✅ Cancelada: ${b.dataset.id}`);
        loadPending();
      } catch (e) { setStatus(`❌ ${e.message}`); }
    });
  }

  el("btnRefresh").onclick = async () => {
    try { setStatus("Cargando..."); await loadPending(); setStatus("Lista actualizada"); }
    catch (e) { setStatus(`❌ ${e.message}`); }
  };

  // BOOT
  (async function boot() {
    // IMPORTANTE: si antes guardaste basura, limpiá y validamos bien
    if (getSecret()) {
      const ok = await validateSession();
      if (ok) {
        showApp();
        setStatus("✅ Panel habilitado.");
        return;
      }
    }
    showLogin();
  })();
</script>

</body>
</html>

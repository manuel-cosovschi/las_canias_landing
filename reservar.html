<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservar - Las Cañas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">

<header class="bg-white shadow">
  <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
    <a href="index.html" class="font-bold text-xl">← Las Cañas</a>
    <a href="index.html#contact" class="text-blue-600 font-semibold">Contacto</a>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-10">
  <h1 class="text-3xl font-bold mb-2">Reservar</h1>
  <p class="text-gray-600 mb-8">
    Elegí la casa, personas y fechas. Luego completás tus datos y elegís el medio de pago.
  </p>

  <div id="statusBox" class="mb-6 p-4 rounded-lg bg-gray-100 text-sm">
    1) Elegí una casa para empezar.
  </div>

  <!-- PASO 1 -->
  <section class="bg-white rounded-xl shadow p-6 mb-6">
    <h2 class="text-xl font-semibold mb-4">1) Estadía</h2>

    <div class="grid sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1">Casa</label>
        <select id="house" class="w-full border rounded-lg p-3">
          <option value="">Seleccionar...</option>
          <option value="LC1">Las Cañas 1</option>
          <option value="LC2">Las Cañas 2</option>
          <option value="LC3">Las Cañas 3</option>
          <option value="LC4">Las Cañas 4</option>
          <option value="LC5">Las Cañas 5</option>
        </select>
        <p id="houseHint" class="text-xs text-gray-500 mt-1 hidden"></p>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Personas</label>
        <input id="guests" type="number" disabled
          class="w-full border rounded-lg p-3 bg-gray-100"
          placeholder="Elegí casa primero">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Check-in (14:00)</label>
        <input id="checkin" type="date" disabled class="w-full border rounded-lg p-3 bg-gray-100">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Check-out (10:00)</label>
        <input id="checkout" type="date" disabled class="w-full border rounded-lg p-3 bg-gray-100">
      </div>
    </div>

    <button id="continue" disabled
      class="mt-5 w-full py-3 rounded-lg bg-blue-600 text-white font-semibold disabled:opacity-40">
      Continuar
    </button>
  </section>

  <!-- PASO 2 -->
  <section id="guestSection" class="bg-white rounded-xl shadow p-6 mb-6 hidden">
    <h2 class="text-xl font-semibold mb-4">2) Datos del huésped</h2>

    <div class="grid sm:grid-cols-2 gap-4">
      <input id="name" class="border rounded-lg p-3" placeholder="Nombre y apellido">
      <input id="dni" class="border rounded-lg p-3" placeholder="DNI">
      <input id="email" type="email" class="border rounded-lg p-3" placeholder="Email">
      <input id="phone" class="border rounded-lg p-3" placeholder="WhatsApp">
    </div>

    <button id="guestContinue" disabled
      class="mt-5 w-full py-3 rounded-lg bg-blue-600 text-white font-semibold disabled:opacity-40">
      Continuar a pago
    </button>
  </section>

  <!-- PASO 3 -->
  <section id="paySection" class="bg-white rounded-xl shadow p-6 hidden">
    <h2 class="text-xl font-semibold mb-4">3) Pago</h2>

    <div class="bg-gray-50 p-4 rounded-lg text-sm">
      <div><strong>Casa:</strong> <span id="sumHouse"></span></div>
      <div><strong>Personas:</strong> <span id="sumGuests"></span></div>
      <div><strong>Check-in:</strong> <span id="sumCheckin"></span></div>
      <div><strong>Check-out:</strong> <span id="sumCheckout"></span></div>
    </div>

    <div class="mt-6 grid sm:grid-cols-2 gap-3">
      <button class="py-3 rounded-lg border">Transferencia</button>
      <button class="py-3 rounded-lg bg-green-600 text-white">Tarjeta</button>
    </div>
  </section>
</main>

<script>
const AVAILABILITY_API = "/api/availability";

const HOUSE_RULES = {
  LC1:{max:5,hint:"Máx 4 (5 con colchón extra)"},
  LC2:{max:4,hint:"Ideal 2 adultos + 2 niños"},
  LC3:{max:6,hint:"4 adultos + 1 joven + 1 niño"},
  LC4:{max:4,hint:"3 adultos o 2 + 2 niños"},
  LC5:{max:3,hint:"2 adultos + 1 niño"}
};

const $ = id => document.getElementById(id);
const house=$("house"), guests=$("guests"), checkin=$("checkin"), checkout=$("checkout");
const cont=$("continue"), status=$("statusBox");
let blocked=[];

function parse(d){const[x,y,z]=d.split("-");return new Date(x,y-1,z);}
function overlap(a,b,c,d){return a<d && b>c;}

async function loadAvailability(h){
  status.textContent="Cargando disponibilidad…";
  const r=await fetch(AVAILABILITY_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({house_code:h})});
  const j=await r.json();
  blocked=(j.blocked||[]).map(b=>({s:parse(b.start),e:parse(b.end)}));
}

house.onchange=async()=>{
  guests.value="";checkin.value="";checkout.value="";
  guests.disabled=false;guests.max=HOUSE_RULES[house.value].max;
  guests.classList.remove("bg-gray-100");
  status.textContent="2) Elegí cantidad de personas";
  await loadAvailability(house.value);
};

guests.oninput=()=>{checkin.disabled=false;checkout.disabled=false;checkin.classList.remove("bg-gray-100");checkout.classList.remove("bg-gray-100");};

function valid(){
  if(!house.value||!guests.value||!checkin.value||!checkout.value)return false;
  const a=parse(checkin.value),b=parse(checkout.value);
  if(b<=a)return false;
  return !blocked.some(r=>overlap(a,b,r.s,r.e));
}

checkin.onchange=checkout.onchange=()=>{
  cont.disabled=!valid();
  status.textContent=cont.disabled?"Fechas no disponibles":"4) Continuar";
};

cont.onclick=()=>{
  $("guestSection").classList.remove("hidden");
};

["name","dni","email","phone"].forEach(i=>{
  $(i).oninput=()=>$("guestContinue").disabled=!($("name").value&&$("dni").value&&$("email").value&&$("phone").value);
});

$("guestContinue").onclick=()=>{
  $("sumHouse").textContent=house.value;
  $("sumGuests").textContent=guests.value;
  $("sumCheckin").textContent=checkin.value;
  $("sumCheckout").textContent=checkout.value;
  $("paySection").classList.remove("hidden");
};
</script>

</body>
</html>
